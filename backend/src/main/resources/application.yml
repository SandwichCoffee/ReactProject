server:
  port: ${PORT:8088}
  error:
    include-message: always
    include-binding-errors: always


spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:tidb}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.portfolio.backend.vo
  configuration:
    map-underscore-to-camel-case: true

app:
  security:
    token-secret: ${TOKEN_SECRET:change-me-local-token-secret}
    token-expiration-seconds: ${TOKEN_EXPIRATION_SECONDS:86400}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}